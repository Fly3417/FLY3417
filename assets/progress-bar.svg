<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="30" viewBox="0 0 600 30">
  <style>
    .progress-fill {
      animation: fillBar 4s ease-in-out infinite alternate;
    }
    @keyframes fillBar {
      0% { width: 0px; }
      100% { width: 500px; }
    }
    .text {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      fill: #B16CFF; /* Ungu Neon */
      font-weight: bold;
    }
  </style>

  <text x="50" y="15" class="text">[+] Bypassing Security...</text>

  <rect x="50" y="20" width="500" height="6" fill="none" stroke="#B16CFF" stroke-width="1" />

  <rect class="progress-fill" x="51" y="21" height="4" fill="#B16CFF" />
</svg>
