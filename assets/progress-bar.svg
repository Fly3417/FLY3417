<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="50" viewBox="0 0 600 50">
  <style>
    .progress-fill {
      animation: fillBar 4s ease-in-out infinite alternate;
    }
    @keyframes fillBar {
      0% { width: 0px; }
      100% { width: 500px; }
    }
    .text {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      fill: #B16CFF;
      font-weight: bold;
    }
  </style>

  <!-- Label Teks -->
  <text x="50" y="20" class="text">[+] Bypassing Security...</text>

  <!-- Bingkai Progress Bar -->
  <rect x="50" y="30" width="500" height="8" fill="none" stroke="#B16CFF" stroke-width="1.5" rx="2" />

  <!-- Isi Progress Bar -->
  <rect class="progress-fill" x="51" y="31" height="6" fill="#B16CFF" rx="1" />
</svg>
