<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 600 80">
  <style>
    .cat-group {
      animation: walk 6s linear infinite;
    }
    @keyframes walk {
      0%   { transform: translateX(20px); }
      45%  { transform: translateX(520px) scaleX(1); }
      50%  { transform: translateX(520px) scaleX(-1); }
      95%  { transform: translateX(20px) scaleX(-1); }
      100% { transform: translateX(20px) scaleX(1); }
    }
    .leg-front { animation: legMove 0.4s linear infinite; }
    .leg-back  { animation: legMove 0.4s linear infinite reverse; }
    @keyframes legMove {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    .line {
      stroke: #00FF00;
      stroke-width: 2;
      stroke-dasharray: 8, 8;
    }
  </style>
  
  <!-- Garis -->
  <line x1="0" y1="70" x2="600" y2="70" class="line" />
  
  <!-- Kucing Hitam Pixel Art -->
  <g class="cat-group">
    <!-- Badan -->
    <rect x="10" y="30" width="30" height="20" fill="#000000" stroke="#333" stroke-width="1"/>
    <!-- Kepala -->
    <rect x="0" y="20" width="15" height="15" fill="#000000" stroke="#333" stroke-width="1"/>
    <!-- Telinga -->
    <rect x="0" y="15" width="5" height="6" fill="#000000"/>
    <rect x="10" y="15" width="5" height="6" fill="#000000"/>
    <!-- Mata Hijau -->
    <rect x="3" y="25" width="3" height="3" fill="#00FF00"/>
    <rect x="9" y="25" width="3" height="3" fill="#00FF00"/>
    <!-- Ekor -->
    <rect x="40" y="25" width="8" height="8" fill="#000000"/>
    <rect x="48" y="18" width="8" height="8" fill="#000000"/>
    <!-- Kaki Depan -->
    <rect class="leg-front" x="10" y="50" width="5" height="15" fill="#000000"/>
    <rect class="leg-back" x="25" y="50" width="5" height="15" fill="#000000"/>
  </g>
</svg>
