<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 400 200">
  <style>
    /* Animasi jalur kotak (kiri -> atas -> kanan -> bawah) */
    .bug-path {
      animation: walkBox 8s linear infinite;
    }
    @keyframes walkBox {
      0%   { transform: translate(50px, 50px) rotate(90deg); }
      25%  { transform: translate(50px, 150px) rotate(0deg); }
      50%  { transform: translate(350px, 150px) rotate(90deg); }
      75%  { transform: translate(350px, 50px) rotate(180deg); }
      100% { transform: translate(50px, 50px) rotate(270deg); }
    }
    
    /* Animasi kaki berjalan */
    .leg {
      animation: wiggle 0.2s linear infinite alternate;
    }
    @keyframes wiggle {
      0% { transform: translateY(0); }
      100% { transform: translateY(2px); }
    }

    /* Garis kotak (jalur) */
    .path-line {
      stroke: #00FF00;
      stroke-width: 2;
      stroke-dasharray: 10, 10;
      fill: none;
    }
  </style>

  <!-- Kotak Jalur -->
  <rect x="50" y="50" width="300" height="100" class="path-line" />

  <!-- Kumbang Top-Down -->
  <g class="bug-path">
    <!-- Tubuh (Oval memanjang dari atas ke bawah) -->
    <rect x="-5" y="-10" width="10" height="20" fill="#00FF00" rx="3" />
    <!-- Kepala (bagian atas) -->
    <rect x="-4" y="-14" width="8" height="5" fill="#00FF00" />
    <!-- Antena -->
    <rect x="-2" y="-18" width="1" height="4" fill="#00FF00" />
    <rect x="1" y="-18" width="1" height="4" fill="#00FF00" />
    <!-- Kaki Kiri -->
    <rect class="leg" x="-10" y="-8" width="5" height="2" fill="#00FF00" />
    <rect class="leg" x="-10" y="0" width="5" height="2" fill="#00FF00" />
    <rect class="leg" x="-10" y="8" width="5" height="2" fill="#00FF00" />
    <!-- Kaki Kanan -->
    <rect class="leg" x="5" y="-8" width="5" height="2" fill="#00FF00" />
    <rect class="leg" x="5" y="0" width="5" height="2" fill="#00FF00" />
    <rect class="leg" x="5" y="8" width="5" height="2" fill="#00FF00" />
  </g>
</svg>
