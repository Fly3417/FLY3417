<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="40" viewBox="0 0 600 40">
  <style>
    .scan {
      animation: scanMove 2s ease-in-out infinite alternate;
    }
    @keyframes scanMove {
      0% { transform: translateX(0px); }
      100% { transform: translateX(500px); }
    }
  </style>
  
  
  <line x1="50" y1="20" x2="550" y2="20" stroke="#333333" stroke-width="2" />
  
  
  <g class="scan">
    <rect x="50" y="15" width="50" height="10" fill="#00FF00" opacity="0.8" rx="2" />
    <rect x="50" y="19" width="50" height="2" fill="#FFFFFF" />
  </g>
</svg>
