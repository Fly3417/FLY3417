name: Commit Pet

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate Commit Pet
        uses: yukurash/commit-pet@v1
        with:
          species: cat
          name: SevenBytePet
          output: commit-pet.svg
          theme: en
          # trigger
